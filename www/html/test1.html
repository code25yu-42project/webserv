<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test 1 Page</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        main {
            text-align: center;
            padding: 24px;
        }

        .label {
            display: inline-block;
            margin-bottom: 10px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #0f172a;
            color: #ffffff;
            font-size: 12px;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        p {
            margin: 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <main>
        <div class="label">TEST 1</div>
        <h1>Main Sample Page</h1>
        <p>This page is used to confirm static page routing on webserv.</p>
    </main>
</body>
</html>
